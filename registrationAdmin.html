<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Registration</title>
  <link rel="stylesheet" href="registrationStyle.css" />
</head>
<body>
  <div class="container">
    <h1>Admin Registration</h1>
    
<!-- File Upload Section (Above Registration Form) -->
<div style="padding: 20px; background-color: #ffffff; border-radius: 5px; margin-bottom: 20px;">
    <h3>Upload a File (e.g., Profile Picture)</h3>
    <form action="upload.php" method="post" enctype="multipart/form-data">
        <input type="file" name="uploadedFile" required>
        <button type="submit" style="margin-left: 10px; padding: 6px 12px; background-color: #28a745; color: white; border: none; border-radius: 4px;">Upload</button>
    </form>
</div>
<form action="processRegistration.php" method="POST" novalidate>

      <div class="section">
        <h2>Personal Information</h2>

        <label for="fullname">Full Name:</label>
        <input type="text" id="fullname" name="fullname" required />

        <label for="ID">Admin ID:</label>
        <input type="text" id="ID" name="ID" required />

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required />

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required />

        <label for="DOB">Date of Birth:</label>
        <input type="date" id="DOB" name="DOB" required />
      </div>

      <div class="section">
        <h2>Gender</h2>
        <label class="inline"><input type="radio" name="gender" value="Male" /> Male</label>
        <label class="inline"><input type="radio" name="gender" value="Female" /> Female</label>
      </div>

      <div class="section">
        <h2>Religion</h2>
        <label class="inline"><input type="checkbox" name="religion[]" value="Muslim" /> Muslim</label>
        <label class="inline"><input type="checkbox" name="religion[]" value="Hindu" /> Hindu</label>
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>
  </div>
</body>
</html>
